name: Windows viewer release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer as a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-viewer-release
  cancel-in-progress: false

env:
  VIEWER_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: viewer_release/packaging/requirements-windows.txt
      - name: Install viewer build dependencies
        run: python -m pip install -r viewer_release/packaging/requirements-windows.txt
      - name: Prepare Inno Setup compiler
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup compiler download failed its SHA-256 check.'
          }
          $target = Join-Path $env:RUNNER_TEMP 'inno'
          $result = Start-Process -FilePath $download -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /PORTABLE=1 /DIR=""$target""" -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Inno Setup returned $($result.ExitCode)." }
      - name: Build and test installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $parameters = @{
            Version = $env:VIEWER_VERSION
            Iscc = Join-Path $env:RUNNER_TEMP 'inno/ISCC.exe'
            VerifyInstall = $true
          }
          $tag = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check for an existing release.' }
          if ($tag -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -lt [version]$env:VIEWER_VERSION) {
            $previous = "TRPL-Viewer-Setup-$($Matches[1])-win-x64.exe"
            gh release download $tag --pattern $previous --dir $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous installer for upgrade testing.' }
            $parameters.PreviousInstaller = Join-Path $env:RUNNER_TEMP $previous
          }
          & ./viewer_release/packaging/build_windows.ps1 @parameters
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TRPL-Viewer-Setup
          path: dist/TRPL-Viewer-Setup-${{ env.VIEWER_VERSION }}-win-x64.exe
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: TRPL-Viewer-Setup
      - name: Publish the Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main. Its workflow will publish the update.'
            exit 0
          fi
          tag="v$VIEWER_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          gh release create "$tag" "TRPL-Viewer-Setup-$VIEWER_VERSION-win-x64.exe" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TRPL Viewer $VIEWER_VERSION" \
            --generate-notes --latest
